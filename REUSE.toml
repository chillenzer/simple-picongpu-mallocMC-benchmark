# SPDX-FileCopyrightText: 2024-2026 Institute of Radiation Physics, Helmholtz-Zentrum Dresden-Rossendorf
# SPDX-License-Identifier: MIT

version = 1

# config.json carries no comments (JSON has none), so its REUSE
# attribution lives here instead of in a file header.
[[annotations]]
path = ["config.json"]
SPDX-FileCopyrightText = "2024-2026 Institute of Radiation Physics, Helmholtz-Zentrum Dresden-Rossendorf"
SPDX-License-Identifier = "MIT"

# conda-lock.yml is generated by conda-lock and must not be edited by
# hand (its header says so), so its attribution lives here.
[[annotations]]
path = ["conda-lock.yml"]
SPDX-FileCopyrightText = "2024-2026 Institute of Radiation Physics, Helmholtz-Zentrum Dresden-Rossendorf"
SPDX-License-Identifier = "MIT"

# conda-linux-64.lock is generated by `conda-lock render` from
# conda-lock.yml (see the README, "Reproducing the analysis"), so its
# attribution lives here.
[[annotations]]
path = ["conda-linux-64.lock"]
SPDX-FileCopyrightText = "2024-2026 Institute of Radiation Physics, Helmholtz-Zentrum Dresden-Rossendorf"
SPDX-License-Identifier = "MIT"

# .gitmodules is a plain git configuration file (the microbenchmark
# submodule pointer) with no place for a per-file license header, so its
# attribution lives here.
[[annotations]]
path = [".gitmodules"]
SPDX-FileCopyrightText = "2024-2026 Institute of Radiation Physics, Helmholtz-Zentrum Dresden-Rossendorf"
SPDX-License-Identifier = "MIT"

# legacy/logs/ (the raw pre-redesign benchmark logs) and
# legacy/legacy_results.h5 (the frozen table built from them) are
# machine-generated project data, git-ignored and not committed; their
# attribution lives here (see legacy/README.md).
[[annotations]]
path = ["legacy/logs/**", "legacy/legacy_results.h5"]
SPDX-FileCopyrightText = "2024-2026 Institute of Radiation Physics, Helmholtz-Zentrum Dresden-Rossendorf"
SPDX-License-Identifier = "MIT"
