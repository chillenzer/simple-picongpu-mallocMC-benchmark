[tool.ruff]
line-length = 120
target-version = "py314"

[tool.ruff.lint]
# Select everything ruff offers and ignore what is not adopted yet, so the
# ignore list doubles as a ledger of the rule families that are still off.
# E1/E2 indentation rules and COM trailing-comma rules are left to
# `ruff format`; E501 is enforced as a hard line limit.
select = ["ALL"]
# B023 (loop variable captured by a function): the plotting loops define
# closures that are called within the same iteration, before the captured
# variables are rebound, so late binding cannot bite.
ignore = [
    "B023",
    # whitespace rules owned by `ruff format`:
    "E1",
    "E2",
    "COM",
    # not a fit for this codebase:
    "N",  # W, N, A, s0 are Amdahl-model parameter names
    "T20",  # print() is the output of these scripts
    "CPY",  # copyright headers; a REUSE-compliance check is planned instead
    "INP",  # analysis/ holds standalone CLI scripts, not an importable package
    # deferred (would need a dedicated pass or a policy decision):
    "D",  # docstring conventions (~40 findings)
    # self-documenting counts (len < 2, size < 3, ndim == 2) dominate this
    # rule's findings; the meaningful tolerances are named constants:
    "PLR2004",
    # no findings so far; not applicable to these scripts:
    "ASYNC",
    "DJ",
    "DOC",
    "FAST",
    "FURB",
    "PD",
    "SLF",
    "SLOT",
    "TC",
]

# The fit/parsing routines (complexity 11-19, up to 74 statements) are
# cohesive data transforms; these limits keep the rules active as a guard
# against new bloat while admitting the existing functions.
[tool.ruff.lint.mccabe]
max-complexity = 20

[tool.ruff.lint.pylint]
max-args = 10
max-positional-args = 10
max-branches = 20
max-statements = 80
